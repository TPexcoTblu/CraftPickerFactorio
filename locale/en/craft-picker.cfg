[controls]
craft-picker-craft-selected=Craft selected entity
craft-picker-craft-selected-five=Craft 5 selected entities
craft-picker-craft-selected-max=Craft max selected entities

[mod-setting-name]
craft-picker-craft-amount=Craft amount
craft-picker-allow-ghosts=Allow crafting from ghosts
craft-picker-show-messages=Show status messages
craft-picker-use-minable-fallback=Use minable-result fallback
craft-picker-ignore-other-forces=Ignore entities from other forces

[mod-setting-description]
craft-picker-craft-amount=How many items to queue per hotkey press.
craft-picker-allow-ghosts=When enabled, ghost entities are resolved to their target entity and crafted.
craft-picker-show-messages=Show short status/error messages in chat.
craft-picker-use-minable-fallback=If place_result mapping is missing, try mineable result products as fallback.
craft-picker-ignore-other-forces=Do not craft when selected entity belongs to another force (except neutral).

[craft-picker]
error.no-character=Craft Picker: You need a character to craft.
error.no-selection=Craft Picker: No entity selected.
error.ghosts-disabled=Craft Picker: Ghost crafting is disabled in settings.
error.ghost-unknown=Craft Picker: Could not resolve ghost target entity.
error.other-force=Craft Picker: Selected entity belongs to another force.
error.no-item=Craft Picker: No craftable item found for "__1__".
error.recipe-locked=Craft Picker: Recipe for "__1__" is not unlocked yet.
error.not-hand-craftable=Craft Picker: "__1__" cannot be crafted by hand.
error.not-enough-resources=Craft Picker: Not enough resources to craft __1__.
error.queue-failed=Craft Picker: Failed to add crafting order.
ok.queued=Craft Picker: Added __1__ item(s) to crafting queue.
