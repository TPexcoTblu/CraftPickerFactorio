[mod-setting-description]
craft-picker-craft-amount=Сколько предметов добавлять в очередь за одно нажатие.
craft-picker-allow-ghosts=Если включено, мод пытается определить целевую сущность призрака и скрафтить её предмет.
craft-picker-show-messages=Показывать короткие сообщения о результате в чате.
craft-picker-use-minable-fallback=Если нет связи через place_result, пробовать продукты добычи как fallback.
craft-picker-ignore-other-forces=Не крафтить, если выбранная сущность принадлежит другой силе (кроме neutral).

